# Trinity production nginx server block — SPEC.md §11.3.
#
# `limit_req_zone` is declared at the http {} level in nginx.conf so it can be
# referenced from any server block here.
#
# `your-domain.com` is a placeholder swapped at deploy time (either via sed
# during deployment or by changing the few literals below). All certbot paths
# follow the same convention.

# ── HTTP → HTTPS redirect, with ACME webroot carveout ──────────────────────
server {
    listen 80;
    server_name your-domain.com;

    # Webroot challenge files — let certbot answer http-01 without us
    # bouncing it to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # TLS hardening — modern protocols and ciphers only.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers — `always` ensures they're attached even on error pages.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Apply the per-IP zone declared in nginx.conf. 100 r/m steady, burst 20.
    limit_req zone=global burst=20 nodelay;

    # Must match the app's BodySizeLimitMiddleware (30 MB) so a multi-image
    # message isn't rejected by nginx before the backend's larger limit applies.
    client_max_body_size 30m;

    # ── SSE streaming endpoint ────────────────────────────────────────────
    # nginx matches longest-prefix first, so this wins over /api/ below for
    # chat requests. Buffering off, longer read/send window (300s) so the
    # connection survives a slow first token from OpenRouter.
    location /api/v1/chat/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Belt-and-suspenders: instruct any upstream proxy to also disable
        # buffering. The backend already sends this header; setting it here
        # too means an injected reverse proxy can't accidentally re-enable it.
        add_header X-Accel-Buffering no always;
    }

    # ── REST API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # ── Frontend (Next.js) ────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js uses websockets in dev only; in production /_next/webpack-hmr
        # isn't reachable. The Upgrade headers are harmless either way.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
