<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Системное оповещение Trinity</title>
  </head>
  <body style="margin:0;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#f5f5f5;color:#1f1f1f;">
    <table role="presentation" style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:8px;padding:32px;">
      <tr>
        <td>
          <p style="margin:0 0 8px 0;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#b91c1c;">🔴 Критическое оповещение</p>
          <h1 style="margin:0 0 16px 0;font-size:20px;font-weight:600;color:#1f1f1f;">{{ title }}</h1>
          <div style="margin:16px 0;padding:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;">
            <pre style="margin:0;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:13px;color:#1f1f1f;white-space:pre-wrap;word-break:break-word;">{{ message }}</pre>
          </div>
          <p style="margin:24px 0 0 0;font-size:13px;color:#666;line-height:1.5;">
            Это автоматическое сообщение от системы мониторинга Trinity.
            Проверьте админ-панель для получения подробной информации.
          </p>
        </td>
      </tr>
    </table>
    <p style="max-width:640px;margin:16px auto 0 auto;font-size:12px;color:#999;text-align:center;">Trinity — шлюз доступа к моделям ИИ</p>
  </body>
</html>
