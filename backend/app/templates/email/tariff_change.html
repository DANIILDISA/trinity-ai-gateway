<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Изменение тарифов Trinity</title>
  </head>
  <body style="margin:0;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#f5f5f5;color:#1f1f1f;">
    <table role="presentation" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:8px;padding:32px;">
      <tr>
        <td>
          <h1 style="margin:0 0 16px 0;font-size:20px;font-weight:600;color:#1f1f1f;">Изменение тарифов</h1>
          <p style="margin:0 0 16px 0;font-size:14px;line-height:1.5;">
            Уведомляем вас об изменении тарифного плана Trinity.
          </p>
          <table role="presentation" style="width:100%;margin:16px 0;border-collapse:collapse;">
            <tr>
              <td style="padding:8px 0;font-size:14px;color:#666;border-bottom:1px solid #eee;">Предыдущий тариф</td>
              <td style="padding:8px 0;font-size:14px;text-align:right;border-bottom:1px solid #eee;">{{ old_tariff }}</td>
            </tr>
            <tr>
              <td style="padding:8px 0;font-size:14px;color:#666;">Новый тариф</td>
              <td style="padding:8px 0;font-size:14px;text-align:right;"><strong>{{ new_tariff }}</strong></td>
            </tr>
          </table>
          <p style="margin:24px 0 0 0;font-size:13px;color:#666;line-height:1.5;">
            Подробности и актуальный прайс-лист доступны в разделе «Тарифы» вашего личного кабинета.
          </p>
        </td>
      </tr>
    </table>
    <p style="max-width:560px;margin:16px auto 0 auto;font-size:12px;color:#999;text-align:center;">Trinity — шлюз доступа к моделям ИИ</p>
  </body>
</html>
