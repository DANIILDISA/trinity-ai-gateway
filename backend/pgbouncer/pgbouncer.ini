; PgBouncer config for Trinity (dev/compose).
;
; Client → PgBouncer auth is md5 (see userlist.txt). PgBouncer → Postgres uses
; the cleartext user/password in each [databases] line, which libpq negotiates
; as SCRAM-SHA-256 against Postgres 16 — this avoids having to store a SCRAM
; verifier in userlist.txt.

[databases]
trinity = host=postgres port=5432 dbname=trinity user=trinity password=trinity
trinity_test = host=postgres port=5432 dbname=trinity_test user=trinity password=trinity

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: a server connection is returned to the pool at the end of
; each transaction, so a small set of real Postgres connections serves many app
; connections. Requires the app to avoid session-level prepared statements —
; handled in app/core/database.py (statement_cache_size=0 + unique stmt names).
pool_mode = transaction

max_client_conn = 500
; tr-3hs (§H1): real Postgres-concurrency ceiling for the trinity db, shared by all
; 4 app workers + the leader's background loops + cron runs. 100 server conns + 20
; reserve ≈ 120 to Postgres; with ~15 PG internals + a few direct migration/admin
; conns this stays ≤ max_connections=200. tr-ans freed these conns during streams.
default_pool_size = 100
; Burst headroom: a brief spike beyond default_pool_size gets up to this many extra
; server conns after waiting reserve_pool_timeout, instead of hard-queueing.
reserve_pool_size = 20
reserve_pool_timeout = 3

; tr-4fy.3: cap how long a client waits for a server slot, replacing the 120s
; default with a tighter slot-reclamation backstop. MUST stay ABOVE app
; request_timeout=30s: a PgBouncer-initiated kill surfaces as an asyncpg
; QueryCanceledError → sqlalchemy.exc.OperationalError, which is neither
; SQLAlchemyTimeoutError (misses the pool_timeout handler) nor asyncio.TimeoutError
; (misses the middleware) → falls through to a 500. By keeping 35 > 30,
; RequestTimeoutMiddleware's asyncio.wait_for(30s) fires FIRST for normal requests
; → coroutine cancelled, slot released, clean 503 request_timeout; query_wait_timeout
; only ever fires for middleware-exempt paths (SSE) as a last-resort slot reclaim.
; reserve_pool_timeout(3s) < query_wait_timeout(35s). Ladder for a queued request:
; pool_timeout(10s, SQLAlchemy checkout) < request_timeout(30s, middleware→503) <
; query_wait_timeout(35s, PgBouncer backstop).
query_wait_timeout = 35

; Backstop for a connection stuck "idle in transaction" (e.g. a leaked/orphaned
; server connection holding row locks — the tr-dus incident). Set just above
; Postgres's idle_in_transaction_session_timeout (60s) so Postgres aborts the
; transaction first with a clean error and PgBouncer then reclaims the slot.
; query_timeout is deliberately NOT set: app queries are short, but a blanket
; cap risks killing a legitimately slow one. (tr-t6o)
idle_transaction_timeout = 70

server_reset_query = DISCARD ALL

; asyncpg sends these startup parameters; PgBouncer must not reject them.
ignore_startup_parameters = extra_float_digits,options

; Console access for SHOW commands / health checks.
admin_users = trinity
stats_users = trinity
